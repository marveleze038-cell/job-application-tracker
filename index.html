<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Job Application Tracker</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f4f7fb;color:#172033}
.container{max-width:1100px;margin:auto;padding:20px}
header{background:#172033;color:white;padding:25px;border-radius:15px;margin-bottom:20px}
header h1{margin:0 0 8px;font-size:30px}
header p{margin:0;color:#cbd5e1}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin-bottom:20px}
.card{background:white;padding:20px;border-radius:12px;box-shadow:0 3px 12px #00000012}
.card h3{margin:0;color:#64748b;font-size:14px}
.card strong{display:block;font-size:28px;margin-top:8px}
.form{background:white;padding:20px;border-radius:12px;margin-bottom:20px;box-shadow:0 3px 12px #00000012}
.form h2{margin-top:0}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:15px}
input,select,button{width:100%;padding:12px;border:1px solid #d1d5db;border-radius:8px;font-size:15px}
button{background:#2563eb;color:white;border:0;cursor:pointer;font-weight:bold}
button:hover{background:#1d4ed8}
.controls{display:flex;gap:10px;margin-bottom:15px}
.controls input{flex:1}
table{width:100%;border-collapse:collapse;background:white;border-radius:12px;overflow:hidden}
th,td{padding:14px;text-align:left;border-bottom:1px solid #e5e7eb}
th{background:#172033;color:white}
.status{padding:6px 10px;border-radius:20px;font-size:12px;font-weight:bold}
.Applied{background:#dbeafe;color:#1d4ed8}
.Interview{background:#fef3c7;color:#92400e}
.Offer{background:#dcfce7;color:#166534}
.Rejected{background:#fee2e2;color:#991b1b}
.delete{background:#ef4444;width:auto;padding:7px 10px}
.empty{text-align:center;padding:30px;color:#64748b}
@media(max-width:700px){
.stats{grid-template-columns:repeat(2,1fr)}
.grid{grid-template-columns:1fr}
.controls{flex-direction:column}
table{font-size:13px}
th,td{padding:9px}
}
</style>
</head>

<body>
<div class="container">

<header>
<h1>💼 Job Application Tracker</h1>
<p>Track your job applications, interviews and offers in one place.</p>
</header>

<div class="stats">
<div class="card"><h3>Total Applications</h3><strong id="total">0</strong></div>
<div class="card"><h3>Applied</h3><strong id="applied">0</strong></div>
<div class="card"><h3>Interviews</h3><strong id="interviews">0</strong></div>
<div class="card"><h3>Offers</h3><strong id="offers">0</strong></div>
</div>

<div class="form">
<h2>Add Job Application</h2>

<form id="jobForm">
<div class="grid">
<input id="company" placeholder="Company name" required>
<input id="role" placeholder="Job role" required>
<input id="date" type="date" required>
<select id="status">
<option>Applied</option>
<option>Interview</option>
<option>Offer</option>
<option>Rejected</option>
</select>
</div>
<br>
<button type="submit">+ Add Application</button>
</form>
</div>

<div class="controls">
<input id="search" placeholder="🔎 Search company or role...">
<select id="filter">
<option value="All">All Statuses</option>
<option value="Applied">Applied</option>
<option value="Interview">Interview</option>
<option value="Offer">Offer</option>
<option value="Rejected">Rejected</option>
</select>
</div>

<table>
<thead>
<tr>
<th>Company</th>
<th>Role</th>
<th>Date</th>
<th>Status</th>
<th>Action</th>
</tr>
</thead>
<tbody id="jobs"></tbody>
</table>

</div>

<script>
let jobs=JSON.parse(localStorage.getItem("jobs")||"[]");

const form=document.getElementById("jobForm");
const jobsBox=document.getElementById("jobs");
const search=document.getElementById("search");
const filter=document.getElementById("filter");

form.addEventListener("submit",e=>{
e.preventDefault();

jobs.push({
id:Date.now(),
company:company.value,
role:role.value,
date:date.value,
status:status.value
});

save();
form.reset();
});

function save(){
localStorage.setItem("jobs",JSON.stringify(jobs));
render();
}

function render(){
let text=search.value.toLowerCase();
let selected=filter.value;

let list=jobs.filter(j=>
(j.company.toLowerCase().includes(text)||
j.role.toLowerCase().includes(text))&&
(selected==="All"||j.status===selected)
);

jobsBox.innerHTML=list.length?list.map(j=>`
<tr>
<td>${j.company}</td>
<td>${j.role}</td>
<td>${j.date}</td>
<td><span class="status ${j.status}">${j.status}</span></td>
<td><button class="delete" onclick="removeJob(${j.id})">Delete</button></td>
</tr>
`).join(""):`<tr><td colspan="5" class="empty">No job applications yet.</td></tr>`;

document.getElementById("total").textContent=jobs.length;
document.getElementById("applied").textContent=jobs.filter(j=>j.status==="Applied").length;
document.getElementById("interviews").textContent=jobs.filter(j=>j.status==="Interview").length;
document.getElementById("offers").textContent=jobs.filter(j=>j.status==="Offer").length;
}

function removeJob(id){
jobs=jobs.filter(j=>j.id!==id);
save();
}

search.addEventListener("input",render);
filter.addEventListener("change",render);

render();
</script>

</body>
  </html>
