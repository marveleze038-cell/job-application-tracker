<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JobTrack — Application Tracker</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f7fb;color:#182033}.top{height:70px;background:#fff;border-bottom:1px solid #e5e8ef;display:flex;align-items:center;justify-content:space-between;padding:0 6%}.brand b{font-size:22px}.brand span{color:#788197;margin-left:10px;font-size:13px}.wrap{max-width:1100px;margin:auto;padding:45px 22px}.hero{display:flex;justify-content:space-between;align-items:end;gap:20px}.eyebrow{color:#5555d0;font-size:12px;font-weight:bold;letter-spacing:2px}.hero h1{font-size:42px;max-width:700px;margin:8px 0}.muted{color:#70798e;line-height:1.6}.btn{padding:12px 17px;border-radius:10px;border:1px solid #ddd;background:white;cursor:pointer;font-weight:bold}.primary{background:#5555d0;color:white;border:0}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:35px 0}.card{background:white;border:1px solid #e5e8ef;border-radius:14px;padding:20px}.stat span{display:block;color:#788197;font-size:13px}.stat b{display:block;font-size:30px;margin-top:7px}.toolbar{display:flex;gap:12px;margin-bottom:15px}.toolbar input,.toolbar select{padding:12px;border:1px solid #ddd;border-radius:10px}.toolbar input{flex:1}.list{display:grid;gap:12px}.job{display:flex;justify-content:space-between;align-items:center}.job h3{margin:0 0 6px}.job p{margin:0;color:#788197}.pill{padding:7px 11px;border-radius:99px;background:#eef0ff;color:#4d4dc7;font-size:12px;font-weight:bold}.delete{border:0;background:transparent;color:#d44b4b;cursor:pointer;margin-left:12px}dialog{border:0;border-radius:16px;width:min(450px,92vw);padding:0;box-shadow:0 20px 70px #0004}form{padding:25px}label{display:block;font-weight:bold;margin:14px 0}label input,label select{display:block;width:100%;margin-top:7px;padding:11px;border:1px solid #ddd;border-radius:9px}.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}@media(max-width:700px){.hero{display:block}.hero h1{font-size:32px}.stats{grid-template-columns:repeat(2,1fr)}.toolbar{flex-direction:column}}
</style></head><body><header class="top"><div class="brand"><b>JobTrack</b><span>Application Tracker</span></div><button id="theme" class="btn">🌙</button></header><main class="wrap"><section class="hero"><div><p class="eyebrow">CAREER DASHBOARD</p><h1>Track every application in one place.</h1><p class="muted">A responsive job application management system for organizing applications, interviews and offers.</p></div><button id="add" class="btn primary">+ Add application</button></section><section class="stats"><div class="card stat"><span>Total applications</span><b id="total">0</b></div><div class="card stat"><span>Interviews</span><b id="interviews">0</b></div><div class="card stat"><span>Offers</span><b id="offers">0</b></div><div class="card stat"><span>Response rate</span><b id="rate">0%</b></div></section><section class="toolbar"><input id="search" placeholder="Search company or role..."><select id="filter"><option>All</option><option>Applied</option><option>Interview</option><option>Offer</option><option>Rejected</option></select></section><section id="list" class="list"></section></main><dialog id="modal"><form id="form"><h2>Add job application</h2><label>Company<input id="company" required placeholder="Acme Ltd"></label><label>Role<input id="role" required placeholder="Software Engineer"></label><label>Status<select id="status"><option>Applied</option><option>Interview</option><option>Offer</option><option>Rejected</option></select></label><label>Date applied<input id="date" type="date" required></label><div class="actions"><button type="button" id="cancel" class="btn">Cancel</button><button class="btn primary">Save application</button></div></form></dialog><script>
const seed=[{id:1,company:"TechNova",role:"Frontend Developer",status:"Interview",date:"2026-08-20"},{id:2,company:"CloudBase",role:"Software Engineer",status:"Applied",date:"2026-08-18"},{id:3,company:"Bright Labs",role:"Junior Developer",status:"Rejected",date:"2026-08-12"}];let jobs=JSON.parse(localStorage.getItem("jobtrack")||"null")||seed;const $=x=>document.getElementById(x);function esc(s){return s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}function render(){let q=$("search").value.toLowerCase(),f=$("filter").value,r=jobs.filter(j=>(f=="All"||j.status==f)&&(`${j.company} ${j.role}`.toLowerCase().includes(q)));$("list").innerHTML=r.length?r.map(j=>`<article class="card job"><div><h3>${esc(j.role)}</h3><p>${esc(j.company)} · Applied ${j.date}</p></div><div><span class="pill">${j.status}</span><button class="delete" onclick="del(${j.id})">Delete</button></div></article>`).join(""):'<div class="card">No applications found. Add your first application.</div>';$("total").textContent=jobs.length;$("interviews").textContent=jobs.filter(j=>j.status=="Interview").length;$("offers").textContent=jobs.filter(j=>j.status=="Offer").length;let x=jobs.filter(j=>["Interview","Offer","Rejected"].includes(j.status)).length;$("rate").textContent=jobs.length?Math.round(x/jobs.length*100)+"%":"0%";localStorage.setItem("jobtrack",JSON.stringify(jobs))}function del(id){jobs=jobs.filter(j=>j.id!=id);render()}$("add").onclick=()=>{$("date").value=new Date().toISOString().slice(0,10);$("modal").showModal()};$("cancel").onclick=()=>$("modal").close();$("form").onsubmit=e=>{e.preventDefault();jobs.unshift({id:Date.now(),company:$("company").value.trim(),role:$("role").value.trim(),status:$("status").value,date:$("date").value});e.target.reset();$("modal").close();render()};$("search").oninput=render;$("filter").onchange=render;$("theme").onclick=()=>document.body.style.filter=document.body.style.filter?"":"invert(.9)";render();
</script></body></html>
